name: Hola mundo 
on:
  push:
  workflow_dispatch:

jobs: 
  hola:
    runs-on: ubuntu-latest
    steps:
      - name: Saludar
        run: echo "Hola Mundo!"
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: En que carpeta estoy 
        run: pwd
      - name: Listado de archivos
        run: ls -la
      - name: Instalar node 
        uses: actions/setup-node@v4
      - name: Verificar node 
        run: node -- version