name: Save Results
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run_vite:
    runs-on: ubuntu-latest
    steps:
      - name: Download Code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install Dependencies
        working-directory: clase17/tic-tac-toe
        run: npm install

      - name: Run Vite Build
        working-directory: clase17/tic-tac-toe
        run: npx vite build

